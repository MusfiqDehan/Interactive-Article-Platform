name: storyloom

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: storyloom-backend
    container_name: storyloom-backend
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    expose:
      - "8003"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    networks:
      - app_network
      - traefik_proxy
    healthcheck:
      # `/healthz` checks the database only, deliberately: a Redis outage
      # degrades caching but the site must stay up, and a readiness probe that
      # fails on Redis would have Docker restart a perfectly serving container.
      # (`/readyz` checks both and is what a deploy gate should use.)
      #
      # This used to curl `/admin/login/` -- a page that no longer exists, and
      # which was never a health signal in the first place: it renders fine
      # while the database is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://localhost:8003/healthz', headers={'Host':'interactive-articles-api.musfiqdehan.com'}); urllib.request.urlopen(req)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.storyloom-backend.rule=Host(`interactive-articles-api.musfiqdehan.com`)"
      - "traefik.http.routers.storyloom-backend.entrypoints=websecure"
      - "traefik.http.routers.storyloom-backend.tls=true"
      - "traefik.http.services.storyloom-backend.loadbalancer.server.port=8003"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://interactive-articles-api.musfiqdehan.com/api
        - NEXT_PUBLIC_API_BASE_URL=https://interactive-articles-api.musfiqdehan.com/api
    image: storyloom-frontend
    container_name: storyloom-frontend
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3003
      - NEXT_PUBLIC_API_URL=https://interactive-articles-api.musfiqdehan.com/api
      - NEXT_PUBLIC_API_BASE_URL=https://interactive-articles-api.musfiqdehan.com/api
    expose:
      - "3003"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
      - traefik_proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3003/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.storyloom-frontend.rule=Host(`interactive-articles.musfiqdehan.com`)"
      - "traefik.http.routers.storyloom-frontend.entrypoints=websecure"
      - "traefik.http.routers.storyloom-frontend.tls=true"
      - "traefik.http.services.storyloom-frontend.loadbalancer.server.port=3003"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: storyloom-db
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
      - traefik_proxy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  app_network:
    name: storyloom_network
    driver: bridge
  traefik_proxy:
    external: true
