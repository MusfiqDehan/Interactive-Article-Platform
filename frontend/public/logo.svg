<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 64 64"><title id="title">Storyloom</title><desc id="desc">An open book with an unfolding terracotta page and a small interactive detail.</desc><style>@keyframes storyloom-reveal{0%,45%{opacity:0}}.storyloom-page{transform-origin:32px 43px;animation:storyloom-unfold 1.4s ease-out both}.storyloom-detail{animation:storyloom-reveal 1.4s ease-out both}@media (prefers-reduced-motion:reduce){.storyloom-detail,.storyloom-page{animation:none}}</style><rect width="62" height="62" x="1" y="1" fill="#263e35" rx="17"/><rect width="61" height="61" x="1.5" y="1.5" fill="none" stroke="#fff" stroke-opacity=".16" rx="16.5"/><path fill="#f7f2e7" d="M13 18c8-1 14 2 19 6v25c-5-4-11-6-19-5z"/><path fill="#c1cfbd" d="M32 24c5-4 11-7 19-6v26c-8-1-14 1-19 5z"/><path fill="#e99772" d="M32 24c3-7 8-12 15-14v27c-7 2-12 6-15 12z" class="storyloom-page"/><path fill="none" stroke="#263e35" stroke-linecap="round" stroke-width="1.7" d="M18 26c3 0 6 1 9 3m-9 4c3 0 6 1 9 3" opacity=".55"/><g class="storyloom-detail"><circle cx="49" cy="43" r="7" fill="#f7f2e7" stroke="#263e35" stroke-width="2"/><path stroke="#b95835" stroke-linecap="round" stroke-width="1.6" d="M46.5 43h5M49 40.5v5"/></g></svg>